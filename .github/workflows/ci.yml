name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv (with Python 3.12)
        # exact pin: setup-uv publishes floating major tags only up to v7
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      # setup-uv with a python-version already provisions .venv — recreate with
      # --clear so this works regardless of that behavior.
      - name: Create venv
        run: uv venv --clear --python 3.12

      - name: Install project (editable + dev extras)
        run: uv pip install -e ".[dev]"

      - name: Run tests
        run: uv run pytest -q

      # Web UI helper tests (pure functions in web/static/util.js) via Node's
      # built-in runner. The glob form works on all Node versions (the bare
      # directory form broke in newer Node releases).
      - name: JS unit tests
        run: node --test "tests/js/**/*.test.mjs"

      # E4: offline, deterministic eval — replays the committed cassettes in
      # src/ai_dev_assistant/evals/cassettes/ through ReplayProvider, driving the
      # full plan → schedule → review → summarize pipeline with zero network and
      # no API key. Regenerate cassettes (also offline) with:
      #   uv run python -m ai_dev_assistant.evals.replay_eval --record
      - name: Offline replay eval (committed cassettes)
        run: uv run python -m ai_dev_assistant.evals.replay_eval
        env:
          ADA_EVAL_RECORD_HISTORY: "1"

      # Benchmark history: the replay eval above appends its scores (pass rate,
      # quality, cost, git sha) to .ada_data/benchmarks.jsonl; keep it as an
      # artifact so trends across commits can be inspected/downloaded.
      - name: Upload benchmark history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-history
          path: .ada_data/benchmarks.jsonl
          if-no-files-found: ignore

      # NOTE: `uv run ai-dev-assistant eval` against the FULL golden suite (incl.
      # the repo-fixture tasks in evals/fixtures/) still needs a live LLM backend
      # (Claude Code login for claude_sdk, or ANTHROPIC_API_KEY) and is not run
      # in CI; tune samples/timeouts with ADA_EVAL_REPEAT / ADA_EVAL_TASK_TIMEOUT.
